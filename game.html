<!doctype html>
<html>
  <head>
    <title>Arithmetic Game – Online Speed Drill</title>
    <link href="app.css" rel="stylesheet" />
  </head>
  <body>
    <div id="game">
      <span class="left">Seconds left: 120</span>
      <span class="correct">Score: 0</span>
      <div class="banner">
        <div class="start">
          <span class="problem"></span>
          =
          <input class="answer" />
        </div>
        <div class="end">
          <p class="correct">Score: 0</p>
          <p class="pace">Pace: 0</p>
        </div>
      </div>
    </div>
    <script>
      let score = 0;
      let duration = 120;
      let failed = false;
      let typedLength = 0;
      let pace;
      let curProblem;
      let startTime;
      let failTime;
      let timer;

      let problemEl = document.querySelector('.problem');
      let answerEl = document.querySelector('.answer');
      let timeLeftEl = document.querySelector('.left');
      let scoreEl = document.querySelector('span.correct');
      let startDiv = document.querySelector('.start');
      let endDiv = document.querySelector('.end');
      let endScore = document.querySelector('p.correct');
      let paceEl = document.querySelector('p.pace');

      function rand(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function newProblem() {
        const operation = rand(0, 3);
        let problemText;
        let answer;
        if (operation === 0) {
          const a = rand(2, 100);
          const b = rand(2, 100);
          problemText = a + ' + ' + b;
          answer = a + b;
        } else if (operation === 1) {
          const a = rand(2, 100);
          const b = rand(2, 100);
          problemText = a + b + ' - ' + a;
          answer = b;
        } else if (operation === 2) {
          const a = rand(2, 12);
          const b = rand(2, 100);
          problemText = a + ' × ' + b;
          answer = a * b;
        } else {
          const a = rand(2, 12);
          const b = rand(2, 100);
          problemText = a * b + ' ÷ ' + a;
          answer = b;
        }
        problemEl.textContent = problemText;
        answerEl.value = '';
        typedLength = 0;
        curProblem = {
          problemText: problemText,
          answer: answer,
          startTime: Date.now()
        }
      }

      function save() {
        sessionStorage.setItem('game', JSON.stringify({
          score: score,
          failed: failed,
          typed: answerEl.value,
          typedLength: typedLength,
          pace: pace,
          startTime: startTime,
          failTime: failTime,
          curProblem: curProblem
        }));
      }

      function showTimeLeft(now) {
        timeLeftEl.textContent = 'Seconds left: ' + (duration - Math.floor((now - startTime) / 1000));
      }

      function endGame(message) {
        clearInterval(timer);
        sessionStorage.removeItem('game');
        startDiv.style.display = 'none';
        endDiv.style.display = 'block';
        endScore.textContent = message;
      }

      function tick() {
        showTimeLeft(Date.now());
        if (Date.now() - startTime >= duration * 1000) {
          endGame('Score: ' + score);
        }
      }

      answerEl.addEventListener('input', function(e) {
        const value = e.target.value;
        const answer = curProblem.answer.toString();
        if (failed) {
          if (answer === value) {
            paceEl.textContent = 'Pace: ' + pace;
            paceEl.style.display = 'block';
            endGame('Failed: ' + score);
          } else {
            save();
          }
          return;
        }
        if (answer === value) {
          newProblem();
          score++;
          scoreEl.textContent = 'Score: ' + score;
        } else if (value.length <= typedLength || !answer.startsWith(value)) {
          failed = true;
          failTime = Date.now();
          pace = Math.floor(score * duration * 1000 / Math.max(curProblem.startTime - startTime, 1));
          clearInterval(timer);
          showTimeLeft(failTime);
        } else {
          typedLength = value.length;
        }
        save();
      });

      const saved = sessionStorage.getItem('game');
      if (saved) {
        const state = JSON.parse(saved);
        score = state.score;
        failed = state.failed;
        pace = state.pace;
        startTime = state.startTime;
        failTime = state.failTime;
        curProblem = state.curProblem;
        problemEl.textContent = curProblem.problemText;
        answerEl.value = state.typed;
        typedLength = state.typedLength;
        scoreEl.textContent = 'Score: ' + score;
      } else {
        startTime = Date.now();
        newProblem();
        save();
      }

      if (failed) {
        showTimeLeft(failTime);
      } else {
        tick();
        timer = setInterval(tick, 1000);
      }

      answerEl.focus();
      answerEl.setSelectionRange(answerEl.value.length, answerEl.value.length);
    </script>
  </body>
</html>
